{% extends "base.html" %}

{% block title %}500 - Internal Server Error{% endblock %}

{% block content %}
<div class="container py-5 my-5 text-center">
  <div class="empty-state mx-auto border-0 shadow-sm rounded-4 p-5" style="max-width: 550px;">
    <div class="text-warning mb-3">
      <i class="bi bi-exclamation-octagon" style="font-size: 4.5rem;"></i>
    </div>
    <h2 class="fw-bold mb-2">500 — Internal Server Error</h2>
    <p class="text-muted mb-4">
      An unexpected error occurred while processing your request. Our system engineers have been alerted.
    </p>
    <div class="d-flex justify-content-center gap-3">
      <a href="{{ url_for('main.index') }}" class="btn btn-outline-primary">
        <i class="bi bi-house me-1"></i> Home
      </a>
      <a href="{{ url_for('main.visits') }}" class="btn btn-primary">
        <i class="bi bi-arrow-clockwise me-1"></i> Try Again
      </a>
    </div>
  </div>
</div>
{% endblock %}
