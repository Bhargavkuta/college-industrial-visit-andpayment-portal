{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="container py-5 my-5 text-center">
  <div class="empty-state mx-auto border-0 shadow-sm rounded-4 p-5" style="max-width: 550px;">
    <div class="text-primary mb-3">
      <i class="bi bi-compass" style="font-size: 4.5rem;"></i>
    </div>
    <h2 class="fw-bold mb-2">404 — Page Not Found</h2>
    <p class="text-muted mb-4">
      The industrial visit or resource you are looking for might have been moved, closed, or does not exist.
    </p>
    <div class="d-flex justify-content-center gap-3">
      <a href="{{ url_for('main.index') }}" class="btn btn-outline-primary">
        <i class="bi bi-house me-1"></i> Home
      </a>
      <a href="{{ url_for('main.visits') }}" class="btn btn-primary">
        <i class="bi bi-search me-1"></i> Browse Visits
      </a>
    </div>
  </div>
</div>
{% endblock %}
